[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-ops-mcp"
version = "0.5.0"
description = "Shell and file access MCP server for the homelab ops agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Capped below 4: a fresh resolve of ">=3.2" picked fastmcp 4.x, a major this server
    # has never run on. uv.lock pins what is tested and deployed; the CI `latest` job
    # resolves the newest versions these ranges allow, so a forward-compat break shows
    # up there rather than at the next deploy. Moving to 4.x is its own change.
    #
    # Floors are security floors (2026-10-25): fastmcp 3.4.10 fixes GHSA-7xgj-8392-5q4r;
    # mcp 1.30.0 fixes CVE-2026-59951 (StreamableHTTP session accumulation, the
    # transport this server runs) and PYSEC-2026-3481/3482/3483. mcp is a transitive
    # dependency, declared here only to hold that floor.
    "fastmcp>=3.4.10,<4",
    "mcp>=1.30,<2",
    # Also security floors, for the two HTTP-facing transitives: an install that
    # re-resolves into an existing venv (`pip install .`) would otherwise keep
    # whatever old versions it finds. starlette 1.3.1 fixes PYSEC-2026-248/249;
    # python-multipart 0.0.31 fixes the advisories through GHSA-v9pg-7xvm-68hf.
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "psutil>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
# Deliberately NOT in base dependencies: the server must install and run with
# no telemetry libraries present. Every import in telemetry.py is lazy and
# guarded, so a missing package degrades to a no-op rather than a crash.
telemetry = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "influxdb3-python>=0.9",
    "nats-py>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
homelab-ops-mcp = "homelab_ops_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["homelab_ops_mcp"]

[tool.coverage.report]
# Measured 2026-10-25 (v0.5.0 branch, after audit remediation): 98.57% total
# (server.py 100%), identical on Python 3.11, 3.12 and 3.13 and with or without
# the [telemetry] extra.
# The floor sits about 4 points under that: high enough that losing a module's
# tests fails CI, with room for a release that adds code before its last tests.
# Raised from the repo-standards baseline of 80, which a 98% suite could lose a
# whole tool's tests without noticing. Re-measure when moving it.
fail_under = 94
show_missing = true
