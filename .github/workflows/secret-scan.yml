# Secret scanning — B14.
#
#   push (main) / pull_request  gate the incoming change. push is scoped to main so a PR
#                               is not scanned twice.
#   schedule                    scan FULL HISTORY. A credential in public history
#                               survives deletion of the commit that added it.
#
# This repo is public on GitHub, so "we removed it" is not a remediation.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC. Clear of ci.yml's schedule.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
          # Full history. Comment on its own line: repo-conform's B14 check anchors
          # `fetch-depth:\s*0\s*$` to end-of-line.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Pinned version AND pinned artefact digest. A release asset can be replaced under an
      # existing tag, and this binary decides whether credentials reach a public repo.
      # Digest from gitleaks_8.30.1_checksums.txt, confirmed 2026-10-25 for this repo against an
      # independently downloaded archive. Bump both together; a mismatch fails closed.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # "no leaks found" is what a working gate says on a clean tree and what a broken one
      # says on any tree. This plants a synthetic credential in a throwaway copy, requires
      # the scan to go red, then requires the real tree to go green.
      - name: Prove the gate fires on a planted secret
        run: python tests/check_gitleaks_gate.py

      # --exit-code 42 separates "found a secret" from "the scan broke" (both are 1 by
      # default). set +e because Actions runs `run:` under -e, which would exit on 42
      # before the case statement could explain it.
      - name: Scan full history
        run: |
          set +e
          gitleaks detect --source . --redact --no-banner --exit-code 42
          code=$?
          case "$code" in
            0)  echo "clean: no secrets found in history" ;;
            42) echo "::error::gitleaks found secrets in history"; exit 1 ;;
            *)  echo "::error::gitleaks failed with exit $code — this is a SCANNER ERROR, not a clean result"; exit 1 ;;
          esac
